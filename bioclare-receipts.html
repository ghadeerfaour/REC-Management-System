<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Bioclare Receipts - REC Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="top-bar">

        <div class="logo">
            REC Management System
        </div>

        <div class="greenlab-header">
            <img
                src="greenlab-logo.png"
                alt="GreenLab Logo"
                class="greenlab-logo"
            >
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </header>


    <!-- Main Content -->
    <main class="receipts-container">

        <div class="page-header">

            <h1>Bioclare Payment Receipts</h1>

            <p>
                View all recorded Bioclare payment receipts.
            </p>

        </div>


        <!-- Search -->
        <div class="receipt-search">

            <input
                type="text"
                id="biocareReceiptSearch"
                placeholder="Search by customer name..."
            >

        </div>


        <!-- Receipts Table -->
        <div class="table-container">

            <table id="biocareReceiptsTable">

                <thead>

                    <tr>
                        <th>Receipt #</th>
                        <th>Customer</th>
                        <th>Payment</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Created By</th>
                        <th>Created At</th>
                        <th>Receipt Type</th>
                        <th>PDF</th>
                    </tr>

                </thead>

                <tbody id="biocareReceiptsTableBody">

                    <!-- Bioclare receipts will appear here -->

                </tbody>

            </table>

        </div>

<button
    type="button"
    class="back-btn"
    onclick="goToCorrectHome()">
    Back
</button>
    </main>


    <script src="script.js"></script>

</body>

</html>
