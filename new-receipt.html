<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        New Receipt - REC Management System
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

    <!-- ==================================================
         HEADER
         ================================================== -->

    <header class="top-bar">

        <div class="logo">
            REC Management System
        </div>

        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </header>


    <!-- ==================================================
         GREENLAB LOGO
         ================================================== -->

    <div class="greenlab-header">

        <img
            src="greenlab-logo.png"
            alt="GreenLab Logo"
            class="greenlab-logo">

    </div>


    <!-- ==================================================
         MAIN CONTENT
         ================================================== -->

    <main class="receipt-container">


        <!-- Page Header -->

        <div class="page-header">

            <h1>
                New Payment Receipt
            </h1>

            <p>
                Enter the payment information below.
            </p>

        </div>


        <!-- ==================================================
             RECEIPT FORM
             ================================================== -->

        <form
            id="receiptForm"
            class="receipt-form">


            <!-- ==================================================
                 CUSTOMER NAME
                 ================================================== -->

            <div class="input-group">

                <label for="customerName">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    name="customerName"
                    placeholder="Enter customer name"
                    required>

            </div>
            <div class="form-group">
    <label for="customerPhone">
        Customer Phone Number
    </label>

    <input
        type="tel"
        id="customerPhone"
        name="customerPhone"
        placeholder="e.g. +961 71 234 567"
    >
</div>


            <!-- ==================================================
                 PAYMENT DESCRIPTION
                 ================================================== -->

            <div class="input-group">

                <label for="paymentDescription">
                    Payment Description
                </label>

                <input
                    type="text"
                    id="paymentDescription"
                    name="paymentDescription"
                    placeholder="Enter payment description"
                    required>

            </div>
          


            <!-- ==================================================
                 AMOUNT
                 ================================================== -->

            <div class="input-group">

                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Enter amount"
                    min="0"
                    step="0.01"
                    required>

            </div>
             <label for="sumOf">
        The Sum Of
    </label>

    <input
        type="text"
        id="sumOf"
        name="sumOf"
        placeholder="Amount in words"
        readonly
    >

</div>


            <!-- ==================================================
                 PAYMENT DATE
                 ================================================== -->

            <div class="input-group">

                <label for="paymentDate">
                    Payment Date
                </label>

                <input
                    type="date"
                    id="paymentDate"
                    name="paymentDate"
                    required>

            </div>


            <!-- ==================================================
                 RECEIPT TYPE
                 ================================================== -->

            <div class="form-group">

                <label for="receiptType">
                    Receipt Type
                </label>

                <div class="receipt-type-options">

                    <label class="receipt-type-option">

                        <input
                            type="radio"
                            name="receiptType"
                            value="actual"
                            checked>

                        <span>
                            Actual Receipt
                        </span>

                    </label>


                    <label class="receipt-type-option">

                        <input
                            type="radio"
                            name="receiptType"
                            value="official">

                        <span>
                            Official Receipt
                        </span>

                    </label>

                </div>

            </div>


            <!-- ==================================================
                 RECEIPT COMPANY
                 ================================================== -->

            <div class="form-group">

                <label>
                    Receipt Company
                </label>

                <div class="receipt-company-options">

                    <label>

                        <input
                            type="radio"
                            name="company"
                            value="GreenLab"
                            checked>

                        GreenLab

                    </label>


                    <label>

                        <input
                            type="radio"
                            name="company"
                            value="Biocare">

                        Biocare

                    </label>

                </div>

            </div>


            <!-- ==================================================
                 BUTTONS
                 ================================================== -->

            <div class="receipt-buttons">

                <button
                    type="submit"
                    class="save-btn">

                    Save Receipt

                </button>


                <button
                    type="button"
                    class="cancel-btn"
                    onclick="goToCorrectHome()">

                    Cancel

                </button>

            </div>


            <!-- ==================================================
                 SUCCESS / ERROR MESSAGE
                 ================================================== -->

            <div
                id="receiptMessage"
                class="receipt-message">
            </div>


        </form>

    </main>


    <!-- ==================================================
         JAVASCRIPT
         ================================================== -->

    <script
        src="script.js">
    </script>

</body>

</html>
